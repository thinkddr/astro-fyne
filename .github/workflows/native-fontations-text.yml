# SPDX-License-Identifier: Apache-2.0
name: native-fontations-text-experiment
on:
  push:
    paths:
      - ci/text-engine-probe/**
      - .github/workflows/native-fontations-text.yml
      - capture/**
      - example/**
      - src/**
      - conformance.json
      - keyed-conformance.json
      - primitive-conformance.json
      - tsconfig.json
      - typography-probe.json
      - responsive-controls.json
      - responsive-controls-scenario.json
      - native/**
      - package.json
      - bun.lock
  pull_request:
    paths:
      - ci/text-engine-probe/**
      - .github/workflows/native-fontations-text.yml
      - capture/**
      - example/**
      - src/**
      - conformance.json
      - keyed-conformance.json
      - primitive-conformance.json
      - tsconfig.json
      - typography-probe.json
      - responsive-controls.json
      - responsive-controls-scenario.json
      - native/**
      - package.json
      - bun.lock
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-fontations-text-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-text:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Check native source formatting before building
        run: |
          task_unformatted="$(gofmt -l native)"
          if [ -n "$task_unformatted" ]; then
            mkdir -p artifacts/native-fontations-text
            gofmt -d native > artifacts/native-fontations-text/adapter-format.diff
            cat artifacts/native-fontations-text/adapter-format.diff
            exit 1
          fi
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm ninja-build cmake meson pkg-config libgtest-dev libwoff-dev zlib1g-dev
      - name: Reject incomplete or contradictory surface build receipts
        run: python3 ci/text-engine-probe/test_surface_build.py
      - name: Resolve pinned source and verify the committed standalone Cargo lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ci/text-engine-probe/build-remote.sh --resolve --work "$RUNNER_TEMP/native-text"
      - name: Compile the native candidate
        run: |
          bash ci/text-engine-probe/build-remote.sh --build --work "$RUNNER_TEMP/native-text"
      - name: Check opaque RGBA transfer and failed-call atomicity
        run: |
          python3 ci/text-engine-probe/test_surface_transfer.py --source-root "$GITHUB_WORKSPACE" \
            --library "$RUNNER_TEMP/native-text/evidence/libastro_fyne_text_experiment.so" \
            --out "$RUNNER_TEMP/native-text/evidence/surface-transfer.json"
      - name: Check immutable glyph snapshots and empty native lines
        run: |
          python3 ci/text-engine-probe/test_snapshot_transfer.py --source-root "$GITHUB_WORKSPACE" \
            --library "$RUNNER_TEMP/native-text/evidence/libastro_fyne_text_experiment.so" \
            --surface-build-contract "$RUNNER_TEMP/native-text/evidence/surface-build-contract.json" \
            --out "$RUNNER_TEMP/native-text/evidence/snapshot-transfer"
      - name: Check clipped native regions without rebasing logical origins
        run: |
          python3 ci/text-engine-probe/test_region_transfer.py --source-root "$GITHUB_WORKSPACE" \
            --library "$RUNNER_TEMP/native-text/evidence/libastro_fyne_text_experiment.so" \
            --surface-build-contract "$RUNNER_TEMP/native-text/evidence/surface-build-contract.json" \
            --out "$RUNNER_TEMP/native-text/evidence/region-transfer"
      - name: Test the optional native provider through real Fyne text primitives
        run: bash ci/text-engine-probe/test-fyne-remote.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/native-text"
      - name: Capture the unchanged original Astro typography source and paint native glyphs
        run: |
          set -euo pipefail
          task_evidence="$GITHUB_WORKSPACE/artifacts/native-fontations-text"
          mkdir -p "$task_evidence"
          bun install --frozen-lockfile --ignore-scripts
          bunx --no-install playwright install --with-deps chromium
          python3 ci/text-engine-probe/observe-fontconfig.py --out "$task_evidence/fontconfig" \
            --sources "$RUNNER_TEMP/native-text/sources.json" \
            --request-policy ci/text-engine-probe/policy.json
          bun src/cli.ts generate --config responsive-controls.json
          bun src/cli.ts check --config responsive-controls.json
          export ASTRO_FYNE_RESPONSIVE_CONTROLS_SOURCE_HASH="$(bun -e 'console.log((await Bun.file("native/generated/responsive_controls.gen.report.json").json()).sourceHash)')"
          bun run build:web
          bunx --no-install astro preview --ignore-lock --root example --host 127.0.0.1 --port 4321 > "$task_evidence/preview.log" 2>&1 &
          task_preview=$!
          trap 'kill "$task_preview" 2>/dev/null || true; wait "$task_preview" 2>/dev/null || true' EXIT
          for task_attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4321/typography-probe > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4321/typography-probe > /dev/null
          bun capture/typography-probe.ts --url http://127.0.0.1:4321/typography-probe --out "$task_evidence/browser"
          bun ci/text-engine-probe/validate-browser.ts "$task_evidence/browser"
          python3 ci/text-engine-probe/driver.py --source-root "$GITHUB_WORKSPACE" \
            --library "$RUNNER_TEMP/native-text/evidence/libastro_fyne_text_experiment.so" \
            --surface-build-contract "$RUNNER_TEMP/native-text/evidence/surface-build-contract.json" \
            --policy ci/text-engine-probe/policy.json --out "$task_evidence/native"
          (cd native && GOWORK=off GOFLAGS=-mod=readonly GOMAXPROCS=2 go build -p=1 \
            -o "$RUNNER_TEMP/native-text/compare" ./visual/cmd/astro-fyne-compare)
          python3 ci/text-engine-probe/compare.py --evidence "$task_evidence" --comparator "$RUNNER_TEMP/native-text/compare"
          python3 ci/text-engine-probe/compare-fyne.py --evidence "$task_evidence" \
            --provider-evidence "$RUNNER_TEMP/native-text/evidence/fyne" --comparator "$RUNNER_TEMP/native-text/compare"
          bun capture/responsive-controls.ts --url http://127.0.0.1:4321/responsive-controls \
            --out "$task_evidence/controls" --report native/generated/responsive_controls.gen.report.json
          bash ci/text-engine-probe/test-controls-remote.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/native-text"
      - name: Retain exact failures, native binary, locks and upstream notices
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-fontations-text-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/native-fontations-text
            ${{ runner.temp }}/native-text/evidence
            ${{ runner.temp }}/native-text/sources.json
            ${{ runner.temp }}/native-text/cargo-metadata.json
            ${{ runner.temp }}/native-text/assembly/Cargo.lock
            ${{ runner.temp }}/native-text/assembly/third_party/rust
            ${{ runner.temp }}/native-text/chromium-Cargo.lock
            ${{ runner.temp }}/native-text/font-policy-source
            ${{ runner.temp }}/native-text/notices
            ci/text-engine-probe
            native/generated
            native/fontations
            responsive-controls.json
            responsive-controls-scenario.json
            typography-probe.json
            example/src/pages/typography-probe.astro
            example/public/fonts/NotoSans-Regular.ttf
            example/public/fonts/LICENSE-NotoSans.txt
          if-no-files-found: warn
